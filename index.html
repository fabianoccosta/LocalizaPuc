<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Localiza Restaurantes PUC</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }

        #mapa-container {
            flex: 2;
            background-color: #ddd;
            background-image: url('mapaPUC.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pin {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #e74c3c;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .pin:hover {
            transform: rotate(-45deg) scale(1.2);
            background: #c0392b;
        }

        #detalhes {
            flex: 1;
            padding: 20px;
            background: #f9f9f9;
            border-left: 1px solid #ccc;
        }

        .hidden { display: none; }
        
        button {
            padding: 8px 15px;
            background: #444;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }

        .rating-container {
            margin: 15px 0;
        }
        
        .stars {
            display: inline-flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .stars input { display: none; }

        .stars label {
            font-size: 30px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.1s;
            padding: 0 2px;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #f1c40f;
        }

        .media-nota {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="mapa-container">
        <div class="pin" style="top: 35%; left: 45%;" onclick="mostrarLocal('restaurante')"></div>
        <div class="pin" style="top: 60%; left: 30%;" onclick="mostrarLocal('cantina')"></div>
    </div>

    <div id="detalhes">
        <h2>Detalhes</h2>
        <div id="conteudo-vazio">Clique em um ponto do mapa</div>
        
        <div id="info-local" class="hidden">
            <h3 id="nome-local"></h3>
            <p id="desc-local"></p>
            
            <hr>
            
            <div class="rating-container">
                <div class="media-nota" id="media-exibicao">Média: 0.0 (0 avaliações)</div>
                
                <p style="margin: 5px 0;">Sua avaliação:</p>
                <div class="stars">
                    <input type="radio" id="star5" name="rating" value="5" onclick="votar(5)"><label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4" onclick="votar(4)"><label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3" onclick="votar(3)"><label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2" onclick="votar(2)"><label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1" onclick="votar(1)"><label for="star1">★</label>
                </div>
            </div>

            <button onclick="fechar()">Fechar</button>
        </div>
    </div>

    <script>
        const locais = {
            restaurante: {
                nome: "Restaurante",
                desc: "Pratos executivos e self-service.",
                votos: [5, 4, 4]
            },
            cantina: {
                nome: "Cantina",
                desc: "Salgados, cafés e lanches.",
                votos: [5, 5, 3]
            }
        };

        let localAtivo = null;

        function calcularMedia(votos) {
            if (votos.length === 0) return { media: "0.0", total: 0 };
            const soma = votos.reduce((acc, nota) => acc + nota, 0);
            const media = (soma / votos.length).toFixed(1);
            return { media: media, total: votos.length };
        }

        function mostrarLocal(id) {
            localAtivo = id;
            const dados = locais[id];

            document.getElementById('conteudo-vazio').classList.add('hidden');
            document.getElementById('info-local').classList.remove('hidden');
            document.getElementById('nome-local').innerText = dados.nome;
            document.getElementById('desc-local').innerText = dados.desc;

            atualizarPlacarMedia();

            const estrelas = document.getElementsByName('rating');
            estrelas.forEach(estrela => estrela.checked = false);
        }

        function votar(nota) {
            if (!localAtivo) return;

            locais[localAtivo].votos.push(nota);
            atualizarPlacarMedia();
            
            alert(`Obrigado pelo seu voto !: ${nota} estrelas!`);
        }

        function atualizarPlacarMedia() {
            const dados = locais[localAtivo];
            const resultado = calcularMedia(dados.votos);
            document.getElementById('media-exibicao').innerText = `Média: ${resultado.media} ★ (${resultado.total} avaliações)`;
        }

        function fechar() {
            localAtivo = null;
            document.getElementById('conteudo-vazio').classList.remove('hidden');
            document.getElementById('info-local').classList.add('hidden');
        }
    </script>

</body>
</html>

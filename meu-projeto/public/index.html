<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Localiza Restaurantes PUC</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }

        /* ── Top bar ── */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 48px;
            background: #1a2d4e;
            color: #fff;
            flex-shrink: 0;
        }

        #topbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
        }

        #topbar .pin-icon {
            width: 18px;
            height: 18px;
            background: #4caf50;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            flex-shrink: 0;
        }

        #topbar .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
        }

        #topbar button {
            padding: 5px 14px;
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.35);
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #topbar button:hover { background: rgba(255,255,255,0.1); }

        /* ── Main content ── */
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #mapa-container {
            flex: 2;
            background-color: #ddd;
            background-image: url('mapaPUC.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .pin {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #e74c3c;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .pin:hover {
            transform: rotate(-45deg) scale(1.2);
            background: #c0392b;
        }

        #detalhes {
            flex: 1;
            padding: 24px 20px;
            background: #f9f9f9;
            border-left: 1px solid #ccc;
            overflow-y: auto;
        }

        .hidden { display: none; }

        button.close-btn {
            padding: 8px 15px;
            background: #444;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }

        .rating-container { margin: 15px 0; }

        .stars {
            display: inline-flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .stars input { display: none; }

        .stars label {
            font-size: 30px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.1s;
            padding: 0 2px;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #f1c40f;
        }

        .media-nota {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        .vote-feedback {
            font-size: 13px;
            color: #4caf50;
            margin-top: 6px;
            min-height: 20px;
        }

        .loading {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="topbar">
        <div class="logo">
            <div class="pin-icon"></div>
            Localiza PUC
        </div>
        <div class="user-info">
            <span id="topbar-username"></span>
            <button onclick="logout()">Sair</button>
        </div>
    </div>

    <div id="main">
        <div id="mapa-container">
            <div class="pin" style="top: 35%; left: 45%;" onclick="mostrarLocal('restaurante')"></div>
            <div class="pin" style="top: 60%; left: 30%;" onclick="mostrarLocal('cantina')"></div>
        </div>

        <div id="detalhes">
            <h2>Detalhes</h2>
            <div id="conteudo-vazio">Clique em um ponto do mapa</div>

            <div id="info-local" class="hidden">
                <h3 id="nome-local"></h3>
                <p id="desc-local"></p>

                <hr style="margin: 16px 0;">

                <div class="rating-container">
                    <div class="media-nota loading" id="media-exibicao">Carregando…</div>

                    <p style="margin: 10px 0 5px;">Sua avaliação:</p>
                    <div class="stars">
                        <input type="radio" id="star5" name="rating" value="5"><label for="star5" onclick="votar(5)">★</label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4" onclick="votar(4)">★</label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3" onclick="votar(3)">★</label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2" onclick="votar(2)">★</label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1" onclick="votar(1)">★</label>
                    </div>
                    <div class="vote-feedback" id="vote-feedback"></div>
                </div>

                <button class="close-btn" onclick="fechar()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        // ── Auth guard ───────────────────────────────────────────────────────
        const token    = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('topbar-username').textContent = username;
        }

        async function logout() {
            await fetch('/logout', { method: 'POST', headers: { 'x-auth-token': token } });
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        // ── Local data (static info only — ratings come from backend) ────────
        const locais = {
            restaurante: { nome: 'Restaurante', desc: 'Pratos executivos e self-service.' },
            cantina:     { nome: 'Cantina',     desc: 'Salgados, cafés e lanches.' }
        };

        let localAtivo = null;

        // ── Show location ────────────────────────────────────────────────────
        async function mostrarLocal(id) {
            localAtivo = id;
            const dados = locais[id];

            document.getElementById('conteudo-vazio').classList.add('hidden');
            document.getElementById('info-local').classList.remove('hidden');
            document.getElementById('nome-local').textContent = dados.nome;
            document.getElementById('desc-local').textContent = dados.desc;
            document.getElementById('vote-feedback').textContent = '';

            const mediaEl = document.getElementById('media-exibicao');
            mediaEl.textContent = 'Carregando…';
            mediaEl.className = 'media-nota loading';

            // Reset stars
            document.getElementsByName('rating').forEach(r => r.checked = false);

            // Fetch reviews from backend
            try {
                const res = await fetch(`/reviews/${id}`);
                const reviews = await res.json();

                if (reviews.length === 0) {
                    mediaEl.textContent = 'Sem avaliações ainda.';
                } else {
                    const avg = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
                    mediaEl.textContent = `Média: ${avg} ★ (${reviews.length} avaliações)`;
                }
                mediaEl.className = 'media-nota';
            } catch {
                mediaEl.textContent = 'Erro ao carregar avaliações.';
                mediaEl.className = 'media-nota';
            }
        }

        // ── Vote ─────────────────────────────────────────────────────────────
        async function votar(nota) {
            if (!localAtivo) return;

            const feedbackEl = document.getElementById('vote-feedback');
            feedbackEl.textContent = 'Enviando…';

            try {
                const res = await fetch('/reviews', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': token
                    },
                    body: JSON.stringify({ localId: localAtivo, rating: nota })
                });

                if (res.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                const data = await res.json();
                document.getElementById('media-exibicao').textContent =
                    `Média: ${data.media} ★ (${data.total} avaliações)`;
                feedbackEl.textContent = `Voto de ${nota} ★ registrado!`;
            } catch {
                feedbackEl.textContent = 'Erro ao enviar voto.';
            }
        }

        function fechar() {
            localAtivo = null;
            document.getElementById('conteudo-vazio').classList.remove('hidden');
            document.getElementById('info-local').classList.add('hidden');
        }
    </script>

</body>
</html>

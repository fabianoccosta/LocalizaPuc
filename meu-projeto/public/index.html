<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Localiza Restaurantes PUC</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }

        /* ── Top bar ── */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 48px;
            background: #1a2d4e;
            color: #fff;
            flex-shrink: 0;
        }

        #topbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
        }

        #topbar .pin-icon {
            width: 18px;
            height: 18px;
            background: #4caf50;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            flex-shrink: 0;
        }

        #topbar .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
        }

        #topbar button {
            padding: 5px 14px;
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.35);
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #topbar button:hover { background: rgba(255,255,255,0.1); }

        /* ── Main content ── */
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #mapa-container {
            flex: 2;
            background-color: #ddd;
            background-image: url('mapaPUC.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

       .pin {
         position: absolute;
        width: 40px;
        height: 40px;
        cursor: pointer;
        transition: transform 0.2s;
        transform: translate(-50%, -50%);
        }

        .pin:hover {
        transform: translate(-50%, -50%) scale(1.2);
        }

        #detalhes {
            flex: 1;
            padding: 24px 20px;
            background: #f9f9f9;
            border-left: 1px solid #ccc;
            overflow-y: auto;
            text-align: center;
        }

        .hidden { display: none; }

        button.close-btn {
            padding: 8px 15px;
            background: #444;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }

        .rating-container { margin: 15px 0; }

        .stars {
            display: inline-flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .stars input { display: none; }

        .stars label {
            font-size: 30px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.1s;
            padding: 0 2px;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #f1c40f;
        }

        .media-nota {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        .vote-feedback {
            font-size: 13px;
            color: #4caf50;
            margin-top: 6px;
            min-height: 20px;
        }

        .loading {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="topbar">
        <div class="logo">
            <div class="pin-icon"></div>
            Localiza PUC
        </div>
        <div class="user-info">
            <span id="topbar-username"></span>
            <button onclick="logout()">Sair</button>
        </div>
    </div>

    <div id="main">
        <div id="mapa-container">
           <img class="pin" src="Foodpin.svg"  style="top:51.9%; left:28.3%;" onclick="mostrarLocal('couve_flor')">

            <img class="pin" src="Snackpin.svg" style="top:37.6%; left:56.2%;" onclick="mostrarLocal('porto_do_sabor')">

            <img class="pin" src="Snackpin.svg" style="top:40.6%; left:56.2%;" onclick="mostrarLocal('restaurante')">

            <img class="pin" src="Foodpin.svg"  style="top:47.1%; left:68.5%;" onclick="mostrarLocal('Bandejão')">

            <img class="pin" src="Foodpin.svg"  style="top:66.7%; left:39.9%;" onclick="mostrarLocal('na_medida')">

            <img class="pin" src="Snackpin.svg" style="top:65.0%; left:48.9%;" onclick="mostrarLocal('Megamate')">

            <img class="pin" src="Snackpin.svg" style="top:66.0%; left:57.2%;" onclick="mostrarLocal('Lemax')">

            <img class="pin" src="Snackpin.svg"  style="top:63.2%; left:62.1%;" onclick="mostrarLocal('af_puc')">

            <img class="pin" src="Snackpin.svg" style="top:66.7%; left:66.0%;" onclick="mostrarLocal('General')">

            <img class="pin" src="Snackpin.svg"  style="top:35.1%; left:56.2%;" onclick="mostrarLocal('Casa_da_empada')">

            <img class="pin" src="Foodpin.svg" style="top:65.4%; left:52.9%;" onclick="mostrarLocal('Bar_das_Freiras')">

            <img class="pin" src="Snackpin.svg"  style="top:45.1%; left:62.2%;" onclick="mostrarLocal('Fastway')">
           
        </div>

        <div id="detalhes">
            <h2>Detalhes dos restaurantes</h2>
            <div id="conteudo-vazio">Selecione um ponto no mapa para ter<br> acesso aos detalhes.</div>

            <div id="info-local" class="hidden">
                <h3 id="nome-local"></h3>
                <p id="desc-local"></p>

                <hr style="margin: 16px 0;">

                <div class="rating-container">
                    <div class="media-nota loading" id="media-exibicao">Carregando…</div>

                    <p style="margin: 10px 0 5px;">Sua avaliação:</p>
                    <div class="stars">
                        <input type="radio" id="star5" name="rating" value="5"><label for="star5" onclick="votar(5)">★</label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4" onclick="votar(4)">★</label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3" onclick="votar(3)">★</label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2" onclick="votar(2)">★</label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1" onclick="votar(1)">★</label>
                    </div>
                    <div class="vote-feedback" id="vote-feedback"></div>
                </div>

                <button class="close-btn" onclick="fechar()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        // ── Auth guard ───────────────────────────────────────────────────────
        const token    = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('topbar-username').textContent = username;
        }

        async function logout() {
            await fetch('/logout', { method: 'POST', headers: { 'x-auth-token': token } });
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        // ── Local data (static info only — ratings come from backend) ────────
        const locais = {
            restaurante: { nome: 'Restaurante', desc: 'Pratos executivos e self-service.' },
            porto_do_sabor:     { nome: 'Porto do Sabor',     desc: 'É um restaurante que se destaca por oferecer refeições leves e saborosas, combinando praticidade com uma proposta voltada para alimentação mais saudável. O cardápio reúne opções como açaís, sanduíches, saladas, crepes, sucos naturais e pratos executivos, atendendo a diferentes gostos e momentos do dia. Fundada em 1997, a marca conquistou espaço no Rio de Janeiro pela qualidade dos ingredientes e pelo compromisso em proporcionar uma experiência agradável aos clientes. Com ambiente acolhedor e atendimento rápido, o Porto do Sabor é uma excelente opção para quem busca refeições equilibradas e cheias de sabor.' },
            couve_flor:  { nome: 'Couve Flor',  desc: 'Localizado atrás do IAG, é um restaurante self-service com valor de R$ 48,90/k. Tem grande variedade de comida dentre elas: saladas, massas, japonês, grelhados, churrasco, acompanhamentos e sobremesas. Horário de funcionamento: seg. a sex., de 11:00 as 16:00' },
            af_puc:      { nome: 'AF PUC',      desc: 'Pratos executivos e self-service.' },
            Lemax:   { nome: 'Lemax',    desc: 'LeMax Hamburgueria é uma das hamburguerias mais conhecidas do Rio de Janeiro, reconhecida pela qualidade dos seus hambúrgueres artesanais preparados com carnes nobres e ingredientes selecionados. Com um cardápio variado, a casa oferece opções que vão desde clássicos até receitas exclusivas, além de acompanhamentos, milk-shakes e pratos executivos. Seu ambiente moderno e aconchegante proporciona uma experiência agradável para amigos e famílias, tornando a LeMax uma referência para quem busca sabor, qualidade e atendimento diferenciado. Horario de funcionamento: seg a sexta, de 11 as 22' },
            Fastway:    { nome: 'Fastway',     desc: 'Localizado entre os prédios Frings e Kennedy, o Fast WAY é caracterizado pelos salgados, cafés e sucos. Além disso, vende sanduíches de 15 e 30cm que são montados na hora pelos atendentes. O japonês (Japa WAY) é especializado na comida oriental: yakisoba, sushi, sashimi, temaki e rolls. Horário de funcionamento: seg. a sex., de 6:00 as 23:00' },
            Bandejão:     { nome: 'Bandejão',      desc: 'Localizado no subsolo da Ala Frings, no Edificio Amizade, o bandejão serve café da manhã (das 6:30 às 9h), almoço (das 10:45 às 14:30) e jantar (das 18h às 21h). Os tíquetes podem ser comprados com antencedência no pilotis da Ala Frings, em frente à escada de acesso ao subsolo. Horário de funcionamento: seg. a sex., de 6:30 as 21h' },
            Megamate:     { nome: 'Megamate',      desc: 'MegaMatte é uma rede brasileira de cafeterias e lanchonetes conhecida por oferecer produtos naturais e opções práticas para o dia a dia. Seu cardápio inclui mate gelado, açaí, sucos, sanduíches, salgados, pães de queijo e doces, buscando combinar sabor, rapidez e ingredientes de qualidade. Presente em diversos estados do Brasil, a marca se destaca pelo ambiente acolhedor e pela proposta de alimentação mais saudável e acessível, sendo uma opção popular para café da manhã, lanches e refeições rápidas.' },
            Bar_das_Freiras:         { nome: 'Bar das Freiras',          desc: 'Localizado no prédio Cardeal Leme, o Bar das Freiras tem um preço mais acessível em relação aos outros. Alem de vender salgados, cafés e sucos, caracteriza-se pelo almoço self-service que começa a ser servido as 11:00 e acaba as 15:00  . Existe também a opção do prato-feito. Horário de funcionamento: seg. a sex., de 7:00 as 16:00' },
            Casa_da_empada:       { nome: 'Casa da Empada',        desc: 'No prédio Cardeal Leme existe uma filial da loja Casa da Empada que vende suas empadas de diversos sabores para os alunos. Horário de funcionamento: seg. a sex., de 7:00 as 22:00' },
            General:    { nome: 'General',     desc: 'General Cachorro-Quente é uma lanchonete conhecida por oferecer cachorros-quentes saborosos e bem servidos, preparados com ingredientes de qualidade e combinações que agradam a diferentes paladares. O cardápio reúne opções tradicionais e especiais, acompanhadas de molhos e complementos variados, proporcionando uma experiência gastronômica prática e deliciosa. Com atendimento acolhedor e um ambiente descontraído, o General Cachorro-Quente se destaca como uma excelente opção para quem busca um lanche rápido, saboroso e com ótimo custo-benefício.' },
            na_medida:       { nome: 'Na Medida',        desc: 'A Cafeteria Na Medida é um ambiente acolhedor e agradável, ideal para quem busca uma pausa no dia para apreciar cafés especiais, bebidas quentes e opções de lanches preparados com qualidade. Com um atendimento atencioso e um espaço confortável, a cafeteria proporciona uma experiência que combina sabor, praticidade e bem-estar, sendo um local perfeito para encontros, estudos ou momentos de relaxamento. Seu compromisso é oferecer produtos sempre frescos e um ambiente convidativo, fazendo com que cada visita seja feita na medida certa para os clientes.' },
        };

        let localAtivo = null;

        // ── Show location ────────────────────────────────────────────────────
        async function mostrarLocal(id) {
            localAtivo = id;
            const dados = locais[id];

            document.getElementById('conteudo-vazio').classList.add('hidden');
            document.getElementById('info-local').classList.remove('hidden');
            document.getElementById('nome-local').textContent = dados.nome;
            document.getElementById('desc-local').textContent = dados.desc;
            document.getElementById('vote-feedback').textContent = '';

            const mediaEl = document.getElementById('media-exibicao');
            mediaEl.textContent = 'Carregando…';
            mediaEl.className = 'media-nota loading';

            // Reset stars
            document.getElementsByName('rating').forEach(r => r.checked = false);

            // Fetch reviews from backend
            try {
                const res = await fetch(`/reviews/${id}`);
                const reviews = await res.json();

                if (reviews.length === 0) {
                    mediaEl.textContent = 'Sem avaliações ainda.';
                } else {
                    const avg = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
                    mediaEl.textContent = `Média: ${avg} ★ (${reviews.length} avaliações)`;
                }
                mediaEl.className = 'media-nota';
            } catch {
                mediaEl.textContent = 'Erro ao carregar avaliações.';
                mediaEl.className = 'media-nota';
            }
        }

        // ── Vote ─────────────────────────────────────────────────────────────
        async function votar(nota) {
            if (!localAtivo) return;

            const feedbackEl = document.getElementById('vote-feedback');
            feedbackEl.textContent = 'Enviando…';

            try {
                const res = await fetch('/reviews', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': token
                    },
                    body: JSON.stringify({ localId: localAtivo, rating: nota })
                });

                if (res.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                const data = await res.json();
                document.getElementById('media-exibicao').textContent =
                    `Média: ${data.media} ★ (${data.total} avaliações)`;
                feedbackEl.textContent = `Voto de ${nota} ★ registrado!`;
            } catch {
                feedbackEl.textContent = 'Erro ao enviar voto.';
            }
        }

        function fechar() {
            localAtivo = null;
            document.getElementById('conteudo-vazio').classList.remove('hidden');
            document.getElementById('info-local').classList.add('hidden');
        }
    </script>

</body>
</html>

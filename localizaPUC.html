<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Localiza Restaurantes PUC</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }

        #mapa-container {
            flex: 2;
            background-color: #ddd;
            background-image: url('mapaPUC.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pin {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #e74c3c;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .pin:hover {
            transform: rotate(-45deg) scale(1.2);
            background: #c0392b;
        }

        #detalhes {
            flex: 1;
            padding: 20px;
            background: #f9f9f9;
            border-left: 1px solid #ccc;
        }

        .hidden { display: none; }
        
        button {
            padding: 8px 15px;
            background: #444;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="mapa-container">
        <div class="pin" style="top: 35%; left: 45%;" onclick="mostrar('Restaurante', 'Pratos executivos e self-service.')"></div>
        <div class="pin" style="top: 60%; left: 30%;" onclick="mostrar('Cantina', 'Salgados, cafés e lanches.')"></div>
    </div>

    <div id="detalhes">
        <h2>Detalhes</h2>
        <div id="conteudo-vazio">Clique em um ponto do mapa</div>
        
        <div id="info-local" class="hidden">
            <h3 id="nome-local"></h3>
            <p id="desc-local"></p>
            <button onclick="fechar()">Fechar</button>
        </div>
    </div>

    <script>
        function mostrar(nome, desc) {
            document.getElementById('conteudo-vazio').classList.add('hidden');
            document.getElementById('info-local').classList.remove('hidden');
            document.getElementById('nome-local').innerText = nome;
            document.getElementById('desc-local').innerText = desc;
        }

        function fechar() {
            document.getElementById('conteudo-vazio').classList.remove('hidden');
            document.getElementById('info-local').classList.add('hidden');
        }
    </script>

</body>
</html>
